- aid: nats:nats-jetstream-api
  name: NATS JetStream Management API
  description: >-
    The JetStream wire API provides a protocol-level management interface for configuring and operating
    JetStream streams, consumers, key-value buckets, and object stores. Requests are made by publishing
    to well-known $JS.API.* subjects and responses are returned as typed JSON payloads. This API underlies
    all official NATS client SDKs and the nats CLI.
  humanURL: https://docs.nats.io/reference/reference-protocols/nats_api_reference
  tags:
  - JetStream
  - Management
  - Streaming
  properties:
  - url: https://docs.nats.io/reference/reference-protocols/nats_api_reference
    type: Documentation
  - url: https://docs.nats.io/nats-concepts/jetstream
    type: Reference
  - url: properties/nats-jetstream-api-asyncapi.yml
    type: AsyncAPI
  - url: properties/nats-jetstream-config-json-schema.json
    type: JSONSchema
- aid: nats:nats-kv-api
  name: NATS Key-Value Store API
  description: >-
    The NATS Key-Value Store API is a JetStream-backed abstraction that provides immediately consistent,
    persistent associative array semantics. Clients can create buckets, get, put, delete, and watch keys,
    and receive real-time change notifications. Buckets are implemented as JetStream streams with the
    KV_ prefix.
  humanURL: https://docs.nats.io/nats-concepts/jetstream/key-value-store
  tags:
  - JetStream
  - Key-Value
  - Storage
  properties:
  - url: https://docs.nats.io/nats-concepts/jetstream/key-value-store
    type: Documentation
  - url: https://docs.nats.io/using-nats/developer/develop_jetstream/kv
    type: Reference
  - url: properties/nats-kv-schema.json
    type: JSONSchema
- aid: nats:nats-object-store-api
  name: NATS Object Store API
  description: >-
    The NATS Object Store API is a JetStream-backed abstraction for storing and retrieving arbitrarily
    large binary objects using a chunking mechanism. Objects are identified by a bucket and a name, and
    the API supports put, get, delete, and watch operations for managing stored files and blobs.
  humanURL: https://docs.nats.io/nats-concepts/jetstream/obj_store
  tags:
  - JetStream
  - Object Store
  - Storage
  properties:
  - url: https://docs.nats.io/nats-concepts/jetstream/obj_store
    type: Documentation
  - url: https://docs.nats.io/using-nats/developer/develop_jetstream/object
    type: Reference
  - url: properties/nats-object-store-schema.json
    type: JSONSchema
