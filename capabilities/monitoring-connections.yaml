naftiko: 1.0.0-alpha2
info:
  label: NATS Monitoring HTTP API — Connections
  description: 'NATS Monitoring HTTP API — Connections. 1 operations. Lead operation: Connection information. Self-contained
    Naftiko capability covering one Nats business surface.'
  tags:
  - Nats
  - Connections
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    NATS_API_KEY: NATS_API_KEY
capability:
  consumes:
  - type: http
    namespace: monitoring-connections
    baseUri: http://localhost:8222
    description: NATS Monitoring HTTP API — Connections business capability. Self-contained, no shared references.
    resources:
    - name: connz
      path: /connz
      operations:
      - name: getconnz
        method: GET
        description: Connection information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sort
          in: query
          type: string
        - name: auth
          in: query
          type: boolean
        - name: subs
          in: query
          type: boolean
        - name: offset
          in: query
          type: integer
        - name: limit
          in: query
          type: integer
        - name: cid
          in: query
          type: integer
        - name: state
          in: query
          type: string
  exposes:
  - type: rest
    namespace: monitoring-connections-rest
    port: 8080
    description: REST adapter for NATS Monitoring HTTP API — Connections. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/connz
      name: connz
      description: REST surface for connz.
      operations:
      - method: GET
        name: getconnz
        description: Connection information
        call: monitoring-connections.getconnz
        with:
          sort: rest.sort
          auth: rest.auth
          subs: rest.subs
          offset: rest.offset
          limit: rest.limit
          cid: rest.cid
          state: rest.state
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: monitoring-connections-mcp
    port: 9090
    transport: http
    description: MCP adapter for NATS Monitoring HTTP API — Connections. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: connection-information
      description: Connection information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: monitoring-connections.getconnz
      with:
        sort: tools.sort
        auth: tools.auth
        subs: tools.subs
        offset: tools.offset
        limit: tools.limit
        cid: tools.cid
        state: tools.state
      outputParameters:
      - type: object
        mapping: $.
