naftiko: 1.0.0-alpha2
info:
  label: NATS Monitoring HTTP API — Routes
  description: 'NATS Monitoring HTTP API — Routes. 1 operations. Lead operation: Route information. Self-contained Naftiko
    capability covering one Nats business surface.'
  tags:
  - Nats
  - Routes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    NATS_API_KEY: NATS_API_KEY
capability:
  consumes:
  - type: http
    namespace: monitoring-routes
    baseUri: http://localhost:8222
    description: NATS Monitoring HTTP API — Routes business capability. Self-contained, no shared references.
    resources:
    - name: routez
      path: /routez
      operations:
      - name: getroutez
        method: GET
        description: Route information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: subs
          in: query
          type: boolean
  exposes:
  - type: rest
    namespace: monitoring-routes-rest
    port: 8080
    description: REST adapter for NATS Monitoring HTTP API — Routes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/routez
      name: routez
      description: REST surface for routez.
      operations:
      - method: GET
        name: getroutez
        description: Route information
        call: monitoring-routes.getroutez
        with:
          subs: rest.subs
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: monitoring-routes-mcp
    port: 9090
    transport: http
    description: MCP adapter for NATS Monitoring HTTP API — Routes. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: route-information
      description: Route information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: monitoring-routes.getroutez
      with:
        subs: tools.subs
      outputParameters:
      - type: object
        mapping: $.
