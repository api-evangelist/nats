specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: NATS
providerId: nats
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Cloud Native
  - Message Broker
  - Microservices
  - Pub Sub
  - Streaming
description: NATS itself is open-source (Apache 2.0). Commercial pricing comes from Synadia Cloud, the
  managed NATS platform from Synadia Communications. Synadia Cloud uses tiered subscription pricing per
  Team with quotas on accounts, connections, subscriptions, network data, storage, and message size,
  plus per-unit add-ons for storage and connectivity.
sources:
  - https://www.synadia.com/cloud
  - https://docs.synadia.com/cloud/pricing
plans:
