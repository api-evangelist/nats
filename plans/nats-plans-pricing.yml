    name: NATS Open Source
    type: freemium
    description: Self-hosted NATS server, JetStream, KV, and Object Store. Apache 2.0 licensed.
    entries:
      - label: Self-hosted server
        name: oss_self_hosted
        type: flat
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: NATS Server (Apache 2.0)
      - name: JetStream persistence
      - name: Key-Value Store
      - name: Object Store
      - name: Community support
